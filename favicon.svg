  <!-- lime sparkles -->
  <path d="M14 14 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z" fill="#b6ff5f"/>
  <circle cx="50" cy="46" r="1.8" fill="#46e6e0"/>
  <!-- horns -->
  <path d="M24 22 l-4 -10 8 6 z" fill="#9d6bff"/>
  <path d="M40 22 l4 -10 -8 6 z" fill="#9d6bff"/>
  <!-- body blob -->
  <path d="M32 18 c12 0 18 9 18 20 c0 9 -7 14 -18 14 c-11 0 -18 -5 -18 -14 c0 -11 6 -20 18 -20 z" fill="#9d6bff"/>
  <path d="M32 18 c12 0 18 9 18 20 c0 9 -7 14 -18 14 z" fill="#ff5fb0" opacity="0.35"/>
  <!-- eyes -->
  <circle cx="25" cy="36" r="6" fill="#ece6ff"/>
  <circle cx="39" cy="36" r="6" fill="#ece6ff"/>
  <circle cx="26" cy="37" r="3" fill="#0e0a1c"/>
  <circle cx="40" cy="37" r="3" fill="#0e0a1c"/>
  <circle cx="25" cy="35.5" r="1" fill="#46e6e0"/>
  <circle cx="39" cy="35.5" r="1" fill="#46e6e0"/>
  <!-- little smile -->
  <path d="M28 46 q4 4 8 0" fill="none" stroke="#0e0a1c" stroke-width="2" stroke-linecap="round"/>
